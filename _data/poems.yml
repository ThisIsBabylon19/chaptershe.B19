- "Behold, a queen is coming!<br />
Woman with troops in her soul.<br />
Her gaze bends the dark shadows,<br />
Her hair brings in a new dawn."
- "The vision is you, Cadet!<br />
Your hair is a living crown.<br />
You're here, as purple emblem.<br />
Ave women, here aware!"
- "With strands blooming abundance,<br />
Your crown is a spell and shield,<br />
No rule can cage your affluence;<br />
In storms you'll be unshaken."
- "As the world bows to your light,<br />
Your reign holds with your crown;<br />
Braid in wisdom and magic,<br />
A statement of your power!"