*,

  box-sizing: border-box;
}

  max-width: 100%;
}
body {

  font-family: "Stalemate", cursive;
}

.container {
  overflow: hidden;
  // margin-top: 3%;
}
.book-wrapper {
  position: relative;
  margin: 2% auto;
  width: 670px;
}

.book-wrapper img {
  filter: drop-shadow(15px 5px 5px #494338);
}
.pages-container {
  position: absolute;
  top: 4%;
  left: 3%;
  right: 0;
  bottom: 0;
  width: 91.5%;
  height: 91%;
}

.pages {
}
.pages [class^="page-num-"] {
  background-image: url("https://img00.deviantart.net/cbb9/i/2005/258/c/4/paper_texture_v5_by_bashcorpo.jpg");
  background-size: auto 100%;
  position: relative;
}

.pages-content {
  text-align: center;
  position: absolute;
  width: 100%;
  height: 100%;
  display: table;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 10%;
}

.content-inner {
  text-align: center;
  display: table-cell;
  vertical-align: middle;
}

.book-wrapper {
  user-select: none;
}

.page-num-1 .pages-background {
  background: linear-gradient(
      rgba(255, 255, 255, 0.1),
      rgba(255, 255, 255, 0.1)
    ),
    url(https://openclipart.org/image/2400px/svg_to_png/242093/Vintage-Floral-Texture-Background.png);
  background-size: cover;
  opacity: 0.2;
  width: 100%;
  height: 100%;
  position: absolute;
  left: 0;
  top: 0;
}

		</style>
	</head>

		<div class="container">

			  <img src="https://github.com/slyka85/assets/blob/master/bookcover2.png?raw=true" alt="">

			<div class="pages-container">

					  <div class="text"><p>A Poem in 4 Stanzas</p></div>
					</div>
				  </div>

					<div class="content-inner">{% if forloop.first %}
					  <h1>Dear Cadet,</h1>{% endif %}

					  <h1>Signed, Madam Ella</h1>{% endif %}
					</div>
				  </div>
				</div>
